services:

  # ── Application ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: go-skeleton-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8020}:${APP_PORT:-8020}"
    environment:
      APP_PORT: "${APP_PORT:-8020}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-go_skeleton}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-bananinha123}"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      JWT_EXPIRE_HOUR: "${JWT_EXPIRE_HOUR:-24}"
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-go-skeleton}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skeleton

  laravel:
    build: ./docs/
    container_name: docs-laravel
    ports:
      - "${DOCS_PORT:-8080}:8080"
    volumes:
      - ./docs:/var/www/laravel
    depends_on:
      db:
        condition: service_healthy
    networks:
      - skeleton
    command: sh -c "composer install && php artisan serve --host=0.0.0.0 --port=8080"

  # ── Scheduler ───────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: go-skeleton-scheduler
    restart: unless-stopped
    command: ["/app/scheduler"]
    environment:
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-go_skeleton}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-bananinha123}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skeleton

  # ── MySQL ───────────────────────────────────────────────────────────────────
  db:
    image: "mysql:${MYSQL_VERSION:-8.0}"
    container_name: go-skeleton-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "${DB_DATABASE:-go_skeleton}"
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - skeleton

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: "redis:${REDIS_VERSION:-7-alpine}"
    container_name: go-skeleton-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-bananinha123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-bananinha123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skeleton

  # ── Jaeger / OpenTelemetry ──────────────────────────────────────────────────
  jaeger:
    image: "jaegertracing/all-in-one:${JAEGER_VERSION:-1.56}"
    container_name: go-skeleton-jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_COLLECTOR_PORT:-14268}:14268"
    networks:
      - skeleton

  otel-collector:
    image: "otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.98.0}"
    container_name: go-skeleton-otel
    volumes:
      - ./docker/otel-collector.yml:/etc/otel/config.yaml
    command: ["--config=/etc/otel/config.yaml"]
    depends_on:
      - jaeger
    networks:
      - skeleton

volumes:
  db_data:

networks:
  skeleton:
    driver: bridge
